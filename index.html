<title>Turnos</title>
<meta name="description" content="Registro de turnos médicos por centro, próximos turnos y cobros mensuales.">

<meta name="theme-color" content="#111716" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
<main class="app" id="app" aria-live="polite">
  <div class="head"><div class="eyebrow">Cargando…</div><h1>Mis turnos</h1></div>
</main>
<div id="toast" class="toast" hidden></div>
<nav class="tabbar" aria-label="Principal">
  <div class="in">
    <button class="tab" data-go="inicio" id="tab-inicio">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span>Próximos</span>
    </button>
    <button class="tab" data-go="cobros" id="tab-cobros">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="13" rx="2.5"></rect><circle cx="12" cy="12.5" r="2.5"></circle><path d="M6 9.5v6M18 9.5v6"></path></svg>
      <span>Cobros</span>
    </button>
    <button class="fab" data-go="nuevo" aria-label="Registrar turno">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <button class="tab" data-go="historial" id="tab-historial">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5M12 7v5l3 2"></path></svg>
      <span>Historial</span>
    </button>
    <button class="tab" data-go="lugares" id="tab-lugares">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      <span>Lugares</span>
    </button>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
